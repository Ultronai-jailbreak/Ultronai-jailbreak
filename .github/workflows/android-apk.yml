
name: Build ULTRON Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_API_URL: https://ultronai-jailbreak.onrender.com

      - name: Prepare ULTRON icon
        run: |
          mkdir -p assets
          cp ultron-icon.png assets/icon.png
          npm install --no-save @capacitor/assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: npx cap add android

      - name: Generate ULTRON Android icon
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#08090d' --iconBackgroundColorDark '#08090d'

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-JAILBREAK-V5-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
